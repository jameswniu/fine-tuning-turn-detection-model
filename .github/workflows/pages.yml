name: pages

on:
  push:
    branches: [master]
    paths:
      - "docs/probe-comparison.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The published page IS docs/probe-comparison.html, copied and never edited. The old
      # gh-pages branch held a second copy of it that went stale while master said otherwise,
      # so there is exactly one source for these numbers now.
      - run: |
          mkdir _site
          cp docs/probe-comparison.html _site/index.html
          cp docs/probe-comparison.html _site/probe-comparison.html
          touch _site/.nojekyll
      # Guard the copy rather than any one number. A number check would go stale the next time
      # the page is legitimately regenerated, which is the failure this whole change removes.
      - run: |
          cmp _site/index.html docs/probe-comparison.html
          cmp _site/probe-comparison.html docs/probe-comparison.html
          test -s _site/index.html
      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v4
        id: deployment
